name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A new advisory can hit an idle main: audit weekly, in full.
    - cron: '0 9 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The job id and name `ci` is the required status check of `main` (.github/branch-protection.json).
  # It has no path filter on purpose: a PR that only touches apps/web still reports `ci` as success
  # because Turborepo skips the tasks of packages the change does not affect.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # On PRs run only what the change can affect: changed packages and their dependents. On main
      # the filter is empty and everything runs.
      TURBO_FILTER: ${{ github.event_name == 'pull_request' && format('--filter=...[origin/{0}]', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the turbo filter diffs against origin/<base>
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Typecheck, lint (boundaries), test, build
        run: pnpm exec turbo run typecheck lint test build $TURBO_FILTER
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: ignore
          retention-days: 14
      # Always runs in full, whatever the filter selected: a new advisory affects the lockfile.
      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high

  # Playwright suite (e2e/). Not a required check. It runs when e2e/ or an app changed and the suite
  # exists (e2e/playwright.config.ts). The Playwright config starts the API and the
  # web itself (webServer), as docs/06-testing-strategy.md section 7 describes.
  e2e:
    name: e2e
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether e2e is needed
        id: changes
        run: |
          if git diff --name-only "$BASE_REF"...HEAD 2>/dev/null | grep -qE '^(e2e|apps)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change under e2e/ or apps/: skipping e2e."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.run == 'true' && hashFiles('e2e/playwright.config.ts') != ''
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true' && hashFiles('e2e/playwright.config.ts') != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install, build, install browsers, run e2e
        if: steps.changes.outputs.run == 'true' && hashFiles('e2e/playwright.config.ts') != ''
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm --filter @mini-market/e2e exec playwright install --with-deps chromium
          pnpm e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
